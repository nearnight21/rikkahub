name: Build Self-Signed Release APK

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Create dummy Firebase configuration
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikkahub-custom-release",
              "storage_bucket": "rikkahub-custom-release.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "release-placeholder-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Generate temporary self-signed release key
        run: |
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/rikkahub-release.jks" \
            -storepass rikkahub \
            -keypass rikkahub \
            -alias rikkahub \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=RikkaHub Custom Build, OU=Custom, O=nearnight21, L=Unknown, ST=Unknown, C=US"

          cat > local.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/rikkahub-release.jks
          storePassword=rikkahub
          keyAlias=rikkahub
          keyPassword=rikkahub
          EOF

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Collect release APK files
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/release -name '*.apk' -type f -exec cp {} release-apk/ \;
          ls -lh release-apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-self-signed-release
          path: release-apk/*.apk
          if-no-files-found: error
          retention-days: 14
